name: Site

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Asserts the decoder agrees with every test number in couriers/*.json, so a data
      # change that breaks the site fails here rather than after it deploys.
      - run: npm run test:unit
      # Served from the root of trackingnumber.fyi, so no base path to prefix assets with.
      - run: npm run build
      # Drives the built site in a real browser, desktop and phone.
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta'
        with:
          path: site/build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta'
    # There is one site to publish to, so two branches must not deploy over each other
    # halfway. Whichever finishes last is what is live.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
